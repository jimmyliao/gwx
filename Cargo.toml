[package]
name = "gwx"
version = "0.1.1"
edition = "2021"
description = "Multi-account, policy-governed Google Workspace access for AI agents (wraps gws)."
repository = "https://github.com/jimmyliao/gwx"
homepage = "https://github.com/jimmyliao/gwx"
license = "Apache-2.0"

[[bin]]
name = "gwx"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
regex = "1"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Keep our custom GWX_CLIENT_SECRET env line in release.yml from tripping dist's dirty check
allow-dirty = ["ci"]
# The installers to generate for each app
installers = ["shell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "jimmyliao/homebrew-gwx"
# Publish jobs to run in CI (enable the Homebrew formula push)
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# musl 交叉編譯用 zig(cargo-dist 內建整合),免裝各 target 的 C toolchain。

[profile.dist]
inherits = "release"
lto = "thin"
